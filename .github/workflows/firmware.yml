name: Build selected firmware
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '重新构建的请求编号'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: firmware-request-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[构建]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable issue request
        id: request
        run: python3 scripts/request.py prepare
      - name: Report build stage
        if: steps.request.outputs.cached != 'true'
        run: python3 scripts/request.py building
      - name: Assemble and verify full USB image
        if: steps.request.outputs.cached != 'true'
        run: python3 scripts/build.py --config work/config.json --work work/build --output dist
      - name: Publish and verify download
        if: steps.request.outputs.cached != 'true'
        run: python3 scripts/request.py publish
      - name: Report failure
        if: failure() && steps.request.outcome == 'success'
        run: python3 scripts/request.py failed
